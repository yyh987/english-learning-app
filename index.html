<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Sentence Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <section id="home" class="card">
      <h1>Academic Sentence Trainer</h1>
      <p class="sub">Listen, then type the full sentence.</p>

      <button id="startBtn" class="btn primary">Start</button>
    </section>

    <section id="practice" class="card hidden">
      <div class="topbar">
        <div>Score: <span id="score">0</span></div>
        <div>Q: <span id="qIndex">1</span>/<span id="qTotal">1</span></div>
      </div>

      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>

      <div class="audioRow">
        <button id="playBtn" class="btn">▶ Play</button>
        <button id="repeatBtn" class="btn">↻ Repeat</button>
        <label class="tiny">
          Speed:
          <input id="rate" type="range" min="0.7" max="1.2" step="0.1" value="1" />
          <span id="rateVal">1.0</span>x
        </label>
      </div>

      <div class="inputRow">
        <input id="wordInput" class="input" placeholder="input your answer" autocomplete="off" />
        <button id="addBtn" class="btn primary">Check</button>
        <button id="undoBtn" class="btn">Undo</button>
      </div>

      <div id="answerReveal" class="answerReveal hidden"></div>
      <div id="feedback" class="feedback"></div>

      <div class="bottomRow">
        <button id="skipBtn" class="btn">Skip</button>
        <button id="showBtn" class="btn danger">Show Answer</button>
        <button id="nextBtn" class="btn primary hidden">Next</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <h2>Result</h2>
      <p>Your score: <span id="finalScore">0</span></p>
      <p>Badge: <span id="badge">Beginner</span></p>
      <button id="restartBtn" class="btn primary">Restart</button>
    </section>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
